name: Build

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version passed to actions/setup-node
        type: string
        required: false
        default: 26.x
      run-tests:
        description: Also run npm test after the build
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    - name: Log tool versions (debug only)
      shell: pwsh
      run: Write-Host "::debug::node=$(node -v) npm=$(npm -v)"
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build --if-present
    - name: Test
      if: inputs.run-tests
      run: npm test --if-present
