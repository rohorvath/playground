name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build --if-present

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test --if-present

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Release
      run: echo "Release job completed successfully"