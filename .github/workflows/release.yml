name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      security:
        description: Security value to echo in the release step
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build --if-present

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Test
      run: npm test --if-present

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    environment: dev
    steps:
    - name: Release
      env:
        MY_SECRET: ${{ secrets.MY_SECRET }}
        SECURITY: ${{ inputs.security }}
      run: |
        echo "Release job completed successfully"
        echo "MY_SECRET=$MY_SECRET"
        echo "security=${SECURITY:-<not set>}"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: release
    steps:
    - name: Deploy
      run: |
        echo "Deploy job completed successfully"

  github-release:
    # Creates a GitHub release (patch version +1) for every merge to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Determine next version
      id: version
      run: |
        latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
        if [ -z "$latest" ]; then
          tag=v1.0.0
        else
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v${major}.${minor}.$((patch + 1))"
        fi
        echo "Previous: ${latest:-none}, next: $tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Create release
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  notify:
    # Emails a summary of every merge to main, even when the pipeline failed.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, test, release, deploy, github-release]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Send email
      env:
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
        SHA: ${{ github.sha }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        RELEASE_TAG: ${{ needs.github-release.outputs.tag }}
        RESULT_BUILD: ${{ needs.build.result }}
        RESULT_TEST: ${{ needs.test.result }}
        RESULT_RELEASE: ${{ needs.release.result }}
        RESULT_DEPLOY: ${{ needs.deploy.result }}
        RESULT_GITHUB_RELEASE: ${{ needs.github-release.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 .github/scripts/send-mail.py
