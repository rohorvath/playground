name: PR Build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 20.x
        cache: 'npm'
    - run: |
        whoami
        npm ci
        npm run build --if-present
        npm test --if-present
