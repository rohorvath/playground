name: PR-mergeability

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
    - name: Install dependencies
      run: |
        whoami
        npm ci
    - name: Build
      run: npm run build --if-present
    - name: Test
      run: npm test --if-present
